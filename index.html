<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Drone Strike Ops - Dual Stick</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #010408; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; user-select: none; color: #00ffcc; }
        #ui-layer { position: absolute; inset: 0; z-index: 10; pointer-events: none; }
        
        /* HUD Top */
        .hud-header { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; pointer-events: none; }
        .stat-card { background: rgba(0, 20, 30, 0.8); border: 1px solid rgba(0, 255, 204, 0.3); padding: 12px; border-radius: 8px; backdrop-filter: blur(10px); }
        .bar-bg { width: 140px; height: 4px; background: rgba(0,255,204,0.1); margin-top: 6px; border-radius: 2px; }
        #health-bar { width: 100%; height: 100%; background: #00ffcc; box-shadow: 0 0 15px #00ffcc; transition: width 0.3s; }
        
        /* Aim View (PIP) */
        #pip-container { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); width: 180px; height: 110px; border: 1px solid rgba(0,255,204,0.5); background: #000; overflow: hidden; border-radius: 4px; }
        .pip-label { position: absolute; bottom: 5px; width: 100%; text-align: center; font-size: 8px; font-weight: bold; letter-spacing: 1px; color: #ff3300; }

        /* Controls Layout */
        .controls-container { position: absolute; bottom: 50px; width: 100%; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 50px; box-sizing: border-box; }
        
        /* Joystick Gauche (Translation) */
        .joystick-zone { width: 160px; height: 160px; background: rgba(255,255,255,0.05); border: 1px solid rgba(0,255,204,0.2); border-radius: 50%; position: relative; pointer-events: auto; display: flex; align-items: center; justify-content: center; }
        #stick { width: 60px; height: 60px; background: #00ffcc; border-radius: 50%; box-shadow: 0 0 20px rgba(0,255,204,0.6); position: absolute; }

        /* D-PAD DROITE (Rotation + Altitude + Feu) */
        .dpad-container { position: relative; width: 220px; height: 220px; pointer-events: auto; }
        .dpad-btn { position: absolute; width: 65px; height: 65px; background: rgba(0,255,204,0.05); border: 1px solid rgba(0,255,204,0.4); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #00ffcc; transition: all 0.1s; }
        .dpad-up { top: 0; left: 77px; } /* Altitude + */
        .dpad-down { bottom: 0; left: 77px; } /* Altitude - */
        .dpad-left { top: 77px; left: 0; } /* Rotation L */
        .dpad-right { top: 77px; right: 0; } /* Rotation R */
        .btn-fire { top: 77px; left: 77px; width: 65px; height: 65px; background: rgba(255, 50, 0, 0.2); border: 2px solid #ff3300; border-radius: 50%; color: #ff3300; font-weight: 900; font-size: 12px; box-shadow: 0 0 15px rgba(255,50,0,0.3); z-index: 2; }
        
        .active-btn { background: rgba(0, 255, 204, 0.4) !important; transform: scale(0.95); }
        .active-fire { background: #ff3300 !important; color: #fff !important; box-shadow: 0 0 30px #ff3300; }

        /* Flash Screen */
        #flash { position: absolute; inset: 0; background: white; opacity: 0; pointer-events: none; z-index: 5; }

        #msg-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .btn-restart { margin-top: 30px; padding: 15px 40px; background: #00ffcc; color: #000; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="flash"></div>

    <div id="ui-layer">
        <div class="hud-header">
            <div class="stat-card">
                <div style="font-size: 9px; font-weight: bold;">HULL INTEGRITY</div>
                <div class="bar-bg"><div id="health-bar"></div></div>
            </div>
            <div class="stat-card" style="text-align: right;">
                <div style="font-size: 9px; font-weight: bold;">ALTITUDE</div>
                <div style="font-size: 20px; font-weight: bold; color: #fff;"><span id="alt-val">0</span><span style="font-size: 10px; color: #00ffcc; margin-left: 4px;">M</span></div>
            </div>
        </div>

        <div id="pip-container">
            <div class="pip-label">SATELLITE DOWNLINK</div>
            <div style="position: absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:40px; height:40px; border:1px solid rgba(0,255,204,0.3); border-radius:50%;"></div>
        </div>

        <div class="controls-container">
            <!-- Stick Gauche : Translation (X, Z) -->
            <div class="joystick-zone" id="joystick-left">
                <div id="stick"></div>
            </div>

            <!-- D-PAD Droite : Rotation + Altitude + Feu -->
            <div class="dpad-container">
                <div class="dpad-btn dpad-up" id="ctrl-alt-up">ALT+</div>
                <div class="dpad-btn dpad-down" id="ctrl-alt-down">ALT-</div>
                <div class="dpad-btn dpad-left" id="ctrl-rot-left">◀</div>
                <div class="dpad-btn dpad-right" id="ctrl-rot-right">▶</div>
                <div class="dpad-btn btn-fire" id="ctrl-fire">FEU</div>
            </div>
        </div>
    </div>

    <div id="msg-screen">
        <h1 style="color: #ff3300; font-size: 40px;">MISSION ÉCHOUÉE</h1>
        <p>Lien neuronal interrompu.</p>
        <button class="btn-restart" onclick="location.reload()">RE-DÉPLOIEMENT</button>
    </div>

    <script>
        let scene, camera, pipCamera, renderer, drone, buildings = [], targets = [], bombs = [];
        let inputState = { forward: 0, strafe: 0, up: 0, rot: 0 };
        let droneState = { pos: new THREE.Vector3(0, 50, 0), rotationY: 0, velocity: new THREE.Vector3() };

        // Configuration Joystick
        const joystick = {
            active: false,
            origin: { x: 0, y: 0 },
            current: { x: 0, y: 0 },
            maxDist: 50
        };

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x010408);
            scene.fog = new THREE.FogExp2(0x010408, 0.004);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 5000);
            pipCamera = new THREE.PerspectiveCamera(50, 180/110, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.autoClear = false;
            renderer.toneMapping = THREE.ReinhardToneMapping;
            renderer.toneMappingExposure = 1.2;
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0x203050, 0.8));
            const sun = new THREE.DirectionalLight(0x00ffcc, 1.5);
            sun.position.set(200, 500, 200);
            scene.add(sun);

            createMap();
            setupInputListeners();
            animate();
        }

        function createMap() {
            // Drone
            drone = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(2, 0.3, 1.5), new THREE.MeshStandardMaterial({color: 0x111111, metalness: 1, roughness: 0.2}));
            drone.add(body);
            
            // Rotors avec lueur
            const rGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.05, 16);
            const rMat = new THREE.MeshBasicMaterial({color: 0x00ffcc, transparent: true, opacity: 0.4});
            [[-1.1, 0.9], [1.1, 0.9], [-1.1, -0.9], [1.1, -0.9]].forEach(p => {
                const r = new THREE.Mesh(rGeo, rMat);
                r.position.set(p[0], 0.1, p[1]);
                drone.add(r);
            });
            drone.position.copy(droneState.pos);
            scene.add(drone);

            // Grille Tech
            const grid = new THREE.GridHelper(5000, 100, 0x00ffcc, 0x051515);
            grid.material.opacity = 0.2;
            grid.material.transparent = true;
            scene.add(grid);

            // Bâtiments Cyber
            for(let i=0; i<80; i++) {
                const h = 30 + Math.random() * 100;
                const w = 15 + Math.random() * 10;
                const b = new THREE.Mesh(
                    new THREE.BoxGeometry(w, h, w),
                    new THREE.MeshStandardMaterial({color: 0x020508, emissive: 0x00ffff, emissiveIntensity: Math.random() > 0.8 ? 0.3 : 0.05})
                );
                b.position.set((Math.random()-0.5)*800, h/2, (Math.random()-0.5)*800);
                if(b.position.length() < 40) b.position.x += 50;
                scene.add(b);
                buildings.push(b);
            }

            // Objectifs
            for(let i=0; i<8; i++) {
                const t = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 10, 8), new THREE.MeshStandardMaterial({color: 0xff0000, emissive: 0xff0000, emissiveIntensity: 1}));
                t.position.set((Math.random()-0.5)*700, 5, (Math.random()-0.5)*700);
                scene.add(t);
                targets.push(t);
            }
        }

        function triggerHaptic(type = 'fire') {
            if ("vibrate" in navigator) {
                if(type === 'fire') navigator.vibrate(40);
                else if(type === 'hit') navigator.vibrate([100, 50, 100]);
            }
            const f = document.getElementById('flash');
            f.style.opacity = type === 'fire' ? "0.15" : "0.4";
            setTimeout(() => f.style.opacity = "0", 100);
        }

        function fire() {
            triggerHaptic('fire');
            const missile = new THREE.Mesh(new THREE.SphereGeometry(0.6), new THREE.MeshBasicMaterial({color: 0xffaa00}));
            missile.position.copy(drone.position);
            scene.add(missile);
            
            // Calcul vecteur directionnel basé sur la rotation du drone
            const dir = new THREE.Vector3(0, -0.2, -3).applyAxisAngle(new THREE.Vector3(0,1,0), droneState.rotationY);
            bombs.push({ mesh: missile, v: dir, life: 200 });
        }

        function setupInputListeners() {
            const jZone = document.getElementById('joystick-left');
            const stick = document.getElementById('stick');

            const handleMove = (e) => {
                if(!joystick.active) return;
                const touch = e.touches ? e.touches[0] : e;
                const rect = jZone.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                let dx = touch.clientX - centerX;
                let dy = touch.clientY - centerY;
                const dist = Math.sqrt(dx*dx + dy*dy);
                
                if(dist > joystick.maxDist) {
                    dx *= joystick.maxDist / dist;
                    dy *= joystick.maxDist / dist;
                }

                stick.style.transform = `translate(${dx}px, ${dy}px)`;
                inputState.strafe = dx / joystick.maxDist;
                inputState.forward = -dy / joystick.maxDist;
            };

            jZone.addEventListener('pointerdown', (e) => { joystick.active = true; handleMove(e); });
            window.addEventListener('pointermove', handleMove);
            window.addEventListener('pointerup', () => {
                joystick.active = false;
                stick.style.transform = `translate(0,0)`;
                inputState.forward = 0;
                inputState.strafe = 0;
            });

            // D-PAD & FEU
            const bindBtn = (id, axis, val) => {
                const el = document.getElementById(id);
                el.addEventListener('pointerdown', (e) => { 
                    e.preventDefault();
                    if(axis === 'fire') { fire(); el.classList.add('active-fire'); }
                    else { inputState[axis] = val; el.classList.add('active-btn'); }
                });
                el.addEventListener('pointerup', () => { 
                    if(axis !== 'fire') inputState[axis] = 0; 
                    el.classList.remove('active-btn', 'active-fire'); 
                });
            };

            bindBtn('ctrl-alt-up', 'up', 1);
            bindBtn('ctrl-alt-down', 'up', -1);
            bindBtn('ctrl-rot-left', 'rot', 1);
            bindBtn('ctrl-rot-right', 'rot', -1);
            bindBtn('ctrl-fire', 'fire', 1);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Gestion Physique Drone
            droneState.rotationY += inputState.rot * 0.05;
            drone.rotation.y = droneState.rotationY;

            let force = new THREE.Vector3(inputState.strafe * 0.4, 0, -inputState.forward * 0.4);
            force.applyAxisAngle(new THREE.Vector3(0,1,0), droneState.rotationY);
            
            droneState.velocity.add(force);
            droneState.velocity.multiplyScalar(0.94); // Friction air

            droneState.pos.add(droneState.velocity);
            droneState.pos.y += inputState.up * 0.5;
            droneState.pos.y = Math.max(5, droneState.pos.y);
            drone.position.copy(droneState.pos);

            // Inclinaison dynamique
            drone.rotation.x = THREE.MathUtils.lerp(drone.rotation.x, inputState.forward * 0.3, 0.1);
            drone.rotation.z = THREE.MathUtils.lerp(drone.rotation.z, -inputState.strafe * 0.3, 0.1);

            // Caméra principale (Suivi doux)
            const camOffset = new THREE.Vector3(0, 10, 25).applyAxisAngle(new THREE.Vector3(0,1,0), droneState.rotationY);
            camera.position.lerp(drone.position.clone().add(camOffset), 0.1);
            camera.lookAt(drone.position.clone().add(new THREE.Vector3(0,-5,-40).applyAxisAngle(new THREE.Vector3(0,1,0), droneState.rotationY)));

            // Caméra PIP (Verticale)
            pipCamera.position.set(drone.position.x, drone.position.y - 1, drone.position.z);
            pipCamera.lookAt(drone.position.x, 0, drone.position.z);

            // Bombes & Collisions
            for(let i=bombs.length-1; i>=0; i--) {
                const b = bombs[i];
                b.mesh.position.add(b.v);
                b.v.y -= 0.02; // Gravité
                b.life--;

                if(b.mesh.position.y <= 0 || b.life <= 0) {
                    targets.forEach((t, idx) => {
                        if(t.position.distanceTo(b.mesh.position) < 15) {
                            triggerHaptic('hit');
                            scene.remove(t);
                            targets.splice(idx, 1);
                        }
                    });
                    scene.remove(b.mesh);
                    bombs.splice(i, 1);
                }
            }

            document.getElementById('alt-val').innerText = drone.position.y.toFixed(0);

            // Rendu Multi-Pass
            const w = window.innerWidth, h = window.innerHeight;
            renderer.setViewport(0, 0, w, h);
            renderer.setScissorTest(false);
            renderer.render(scene, camera);

            renderer.setScissorTest(true);
            renderer.setScissor(w/2 - 90, h - 130, 180, 110);
            renderer.setViewport(w/2 - 90, h - 130, 180, 110);
            renderer.render(scene, pipCamera);
        }

        window.onload = init;
        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
