<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Drone Strike Ops - Tactical Fix</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #020508; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; user-select: none; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; pointer-events: none; color: #00ffcc; }
        
        /* HUD Top */
        .hud-top { position: absolute; top: 20px; left: 20px; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
        .hud-box { background: rgba(0, 20, 10, 0.7); padding: 10px; border: 1px solid #00ffcc; border-radius: 4px; min-width: 140px; box-shadow: 0 0 10px rgba(0, 255, 204, 0.2); }
        .bar-container { width: 100%; height: 8px; border: 1px solid #00ffcc; margin-top: 5px; background: rgba(0,0,0,0.5); }
        #health-fill { width: 100%; height: 100%; background: #00ffcc; transition: width 0.3s; }
        
        /* Tactical Info */
        #intel-module { position: absolute; bottom: 180px; left: 20px; width: 240px; background: rgba(0, 15, 5, 0.85); border-left: 4px solid #00ffcc; padding: 12px; font-size: 11px; pointer-events: auto; }
        
        /* Mini-Map / Aim View */
        #aim-view { position: absolute; top: 20px; right: 20px; width: 150px; height: 150px; border: 2px solid #00ffcc; background: #000; overflow: hidden; }
        .crosshair-center { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; border: 1px solid red; border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; }

        /* Controls */
        .controls { position: absolute; bottom: 30px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; pointer-events: none; }
        .joy-area { width: 120px; height: 120px; background: rgba(0, 255, 204, 0.1); border: 2px solid rgba(0, 255, 204, 0.3); border-radius: 60px; position: relative; pointer-events: auto; }
        #stick { width: 40px; height: 40px; background: #fff; border-radius: 20px; position: absolute; top: 40px; left: 40px; box-shadow: 0 0 15px #fff; }
        
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; pointer-events: auto; }
        .btn { width: 70px; height: 70px; border-radius: 35px; border: 2px solid #fff; background: rgba(255,255,255,0.1); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; }
        .btn-fire { grid-row: span 2; width: 100px; height: 100px; border-color: #ff3300; color: #ff3300; background: rgba(255, 51, 0, 0.2); font-size: 20px; }

        #msg-screen { position: absolute; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .btn-restart { margin-top: 20px; padding: 15px 40px; background: #00ffcc; color: #000; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div class="hud-top">
            <div class="hud-box">OBJ: <span id="targets-count">0</span> | NIV: <span id="level-val">1</span></div>
            <div class="hud-box">COQUE <div class="bar-container"><div id="health-fill"></div></div></div>
            <div class="hud-box">ALT: <span id="alt-val">12.0</span>m</div>
        </div>

        <div id="intel-module">
            <div style="font-weight: bold; margin-bottom: 5px; color: #fff;">LIAISON TACTIQUE</div>
            <div id="intel-text">Recherche de signal satellite...</div>
        </div>

        <div id="aim-view">
            <div class="crosshair-center"></div>
        </div>

        <div class="controls">
            <div class="joy-area" id="joy-base">
                <div id="stick"></div>
            </div>
            <div class="action-btns">
                <div class="btn btn-fire" id="fire-btn">FEU</div>
                <div class="btn" id="up-btn">↑</div>
                <div class="btn" id="down-btn">↓</div>
            </div>
        </div>
    </div>

    <div id="msg-screen">
        <h1 id="msg-title" style="font-size: 40px; margin: 0;">MISSION TERMINÉE</h1>
        <p id="msg-desc">Analyse des données en cours...</p>
        <button class="btn-restart" id="next-btn">CONTINUER</button>
    </div>

    <script>
        // --- CONFIGURATION ---
        let scene, camera, pipCamera, renderer, drone, buildings = [], targets = [], bombs = [];
        let level = 1, health = 100, altitude = 15;
        let keys = { w:false, s:false, a:false, d:false, up:false, down:false };
        let moveInput = { x: 0, y: 0 };
        let velocity = new THREE.Vector3();

        // --- INITIALISATION SCÈNE ---
        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x05080c);
            scene.fog = new THREE.Fog(0x05080c, 20, 400);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            pipCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 500);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.autoClear = false;
            document.body.appendChild(renderer.domElement);

            // Lumières (Crucial pour voir le décor)
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0x00ffcc, 0.8);
            sun.position.set(50, 200, 50);
            scene.add(sun);

            // Sol
            const grid = new THREE.GridHelper(1000, 100, 0x00ffcc, 0x0a1a1a);
            scene.add(grid);

            createLevel();
            setupInputs();
            animate();
        }

        function createLevel() {
            // Drone
            const dGroup = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.3, 1.2), new THREE.MeshPhongMaterial({color: 0x333333}));
            dGroup.add(body);
            // Bras et hélices
            const armG = new THREE.BoxGeometry(2.5, 0.1, 0.1);
            const arm1 = new THREE.Mesh(armG, new THREE.MeshPhongMaterial({color: 0x222222}));
            arm1.rotation.y = Math.PI/4; dGroup.add(arm1);
            const arm2 = new THREE.Mesh(armG, new THREE.MeshPhongMaterial({color: 0x222222}));
            arm2.rotation.y = -Math.PI/4; dGroup.add(arm2);

            drone = dGroup;
            drone.position.set(0, altitude, 0);
            scene.add(drone);

            // Bâtiments
            for(let i=0; i<40; i++) {
                const h = 10 + Math.random() * 40;
                const w = 10 + Math.random() * 10;
                const b = new THREE.Mesh(
                    new THREE.BoxGeometry(w, h, w),
                    new THREE.MeshPhongMaterial({color: 0x111115, emissive: 0x000505})
                );
                let px = (Math.random()-0.5) * 300;
                let pz = (Math.random()-0.5) * 300;
                if(Math.abs(px) < 15 && Math.abs(pz) < 15) px += 30; // Eviter le spawn
                b.position.set(px, h/2, pz);
                scene.add(b);
                buildings.push(b);
            }

            // Cibles
            const targetCount = 3 + level;
            document.getElementById('targets-count').innerText = targetCount;
            for(let i=0; i<targetCount; i++) {
                const t = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 2), new THREE.MeshPhongMaterial({color: 0xff0000}));
                t.position.set((Math.random()-0.5)*200, 1, (Math.random()-0.5)*200);
                scene.add(t);
                targets.push(t);
            }
        }

        function fire() {
            const b = new THREE.Mesh(new THREE.SphereGeometry(0.4), new THREE.MeshBasicMaterial({color: 0xffaa00}));
            b.position.copy(drone.position);
            scene.add(b);
            bombs.push({ mesh: b, v: -0.5 });
        }

        function setupInputs() {
            // Clavier
            window.onkeydown = (e) => {
                const k = e.key.toLowerCase();
                if(k === 'w' || k === 'z') keys.w = true;
                if(k === 's') keys.s = true;
                if(k === 'a' || k === 'q') keys.a = true;
                if(k === 'd') keys.d = true;
                if(e.code === 'ShiftLeft') keys.up = true;
                if(e.code === 'ControlLeft') keys.down = true;
                if(e.code === 'Space') fire();
            };
            window.onkeyup = (e) => {
                const k = e.key.toLowerCase();
                if(k === 'w' || k === 'z') keys.w = false;
                if(k === 's') keys.s = false;
                if(k === 'a' || k === 'q') keys.a = false;
                if(k === 'd') keys.d = false;
                if(e.code === 'ShiftLeft') keys.up = false;
                if(e.code === 'ControlLeft') keys.down = false;
            };

            // Boutons HUD
            document.getElementById('fire-btn').onclick = fire;
            
            const upBtn = document.getElementById('up-btn');
            upBtn.onpointerdown = () => keys.up = true;
            upBtn.onpointerup = () => keys.up = false;
            
            const downBtn = document.getElementById('down-btn');
            downBtn.onpointerdown = () => keys.down = true;
            downBtn.onpointerup = () => keys.down = false;

            // Joystick
            const joyBase = document.getElementById('joy-base');
            const stick = document.getElementById('stick');
            let active = false;

            const handleJoy = (e) => {
                if(!active) return;
                const rect = joyBase.getBoundingClientRect();
                const touch = e.touches ? e.touches[0] : e;
                const dx = touch.clientX - (rect.left + 60);
                const dy = touch.clientY - (rect.top + 60);
                const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 50);
                const angle = Math.atan2(dy, dx);
                
                stick.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
                moveInput.x = (Math.cos(angle)*dist) / 50;
                moveInput.y = (Math.sin(angle)*dist) / 50;
            };

            joyBase.onpointerdown = (e) => { active = true; handleJoy(e); };
            window.onpointermove = handleJoy;
            window.onpointerup = () => { active = false; stick.style.transform = "translate(0,0)"; moveInput = {x:0, y:0}; };
        }

        function animate() {
            requestAnimationFrame(animate);

            // Mouvement Drone
            if(keys.w) moveInput.y = -0.8;
            else if(keys.s) moveInput.y = 0.8;
            if(keys.a) moveInput.x = -0.8;
            else if(keys.d) moveInput.x = 0.8;

            if(keys.up) altitude += 0.2;
            if(keys.down) altitude -= 0.2;
            altitude = Math.max(2, altitude);

            velocity.x = (velocity.x + moveInput.x * 0.1) * 0.92;
            velocity.z = (velocity.z + moveInput.y * 0.1) * 0.92;

            drone.position.x += velocity.x;
            drone.position.z += velocity.z;
            drone.position.y = THREE.MathUtils.lerp(drone.position.y, altitude, 0.1);

            // Inclinaison visuelle
            drone.rotation.z = -velocity.x * 0.5;
            drone.rotation.x = velocity.z * 0.5;

            // Caméras
            camera.position.set(drone.position.x, drone.position.y + 10, drone.position.z + 25);
            camera.lookAt(drone.position);

            pipCamera.position.set(drone.position.x, drone.position.y - 1, drone.position.z);
            pipCamera.lookAt(drone.position.x, 0, drone.position.z);

            // Gestion Bombes
            for(let i=bombs.length-1; i>=0; i--) {
                const b = bombs[i];
                b.mesh.position.y += b.v;
                b.v -= 0.02; // Gravité

                if(b.mesh.position.y <= 0) {
                    // Collision cibles
                    targets.forEach((t, idx) => {
                        if(t.position.distanceTo(b.mesh.position) < 5) {
                            scene.remove(t);
                            targets.splice(idx, 1);
                            document.getElementById('targets-count').innerText = targets.length;
                        }
                    });
                    scene.remove(b.mesh);
                    bombs.splice(i, 1);
                }
            }

            // HUD
            document.getElementById('alt-val').innerText = drone.position.y.toFixed(1);
            
            // Rendu final
            const w = window.innerWidth;
            const h = window.innerHeight;
            renderer.setViewport(0, 0, w, h);
            renderer.setScissorTest(false);
            renderer.render(scene, camera);

            // Rendu PIP (Aim View)
            const side = 150;
            renderer.setScissorTest(true);
            renderer.setScissor(w - side - 20, h - side - 20, side, side);
            renderer.setViewport(w - side - 20, h - side - 20, side, side);
            renderer.render(scene, pipCamera);

            if(targets.length === 0) showEnd("MISSION RÉUSSIE", "Zone sécurisée.");
        }

        function showEnd(title, desc) {
            const screen = document.getElementById('msg-screen');
            screen.style.display = 'flex';
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-desc').innerText = desc;
            document.getElementById('next-btn').onclick = () => location.reload();
        }

        window.onload = init;
        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>
</html>
